<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drip Designs Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo-area">

            <a href="index.html">

                <img
                    src="assets/logo.png"
                    alt="Drip Designs"
                    class="logo">

            </a>

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>

        </nav>

    </header>

    <!-- ADMIN CONTAINER -->

    <div class="admin-container">

        <!-- PAGE TITLE -->

        <div class="admin-header">

            <div class="admin-title">
                Order Management
            </div>

            <div class="admin-subtitle">
                Shopify-style admin dashboard for managing customer orders
            </div>

        </div>

        <!-- KPI SECTION -->

        <div class="kpi-grid">

            <div class="kpi-card">

                <div class="kpi-label">
                    Total Orders
                </div>

                <div
                    id="totalOrders"
                    class="kpi-value">
                    0
                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-label">
                    Pending Orders
                </div>

                <div
                    id="pendingOrders"
                    class="kpi-value">
                    0
                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-label">
                    Delivered Orders
                </div>

                <div
                    id="deliveredOrders"
                    class="kpi-value">
                    0
                </div>

            </div>

            <div class="kpi-card">

                <div class="kpi-label">
                    Total Revenue
                </div>

                <div
                    id="totalRevenue"
                    class="kpi-value">
                    ₹0
                </div>

            </div>

        </div>

        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="search-wrapper">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by Order Number, Customer Name or Phone Number">

            </div>

            <div class="filter-row">

                <button
                    class="filter-btn active"
                    data-status="ALL">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-status="PENDING">
                    Pending
                </button>

                <button
                    class="filter-btn"
                    data-status="CONFIRMED">
                    Confirmed
                </button>

                <button
                    class="filter-btn"
                    data-status="IN_PRODUCTION">
                    Production
                </button>

                <button
                    class="filter-btn"
                    data-status="SHIPPED">
                    Shipped
                </button>

                <button
                    class="filter-btn"
                    data-status="DELIVERED">
                    Delivered
                </button>

                <button
                    class="filter-btn"
                    data-status="CANCELLED">
                    Cancelled
                </button>

            </div>

        </div>

        <!-- ORDERS TABLE -->

        <div class="table-card">

            <div class="table-header">
                Orders
            </div>

            <div style="overflow-x:auto;">

                <table class="orders-table">

                    <thead>

                        <tr>

                            <th>Order Number</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="ordersTable">

                        <tr>

                            <td colspan="7">

                                <div class="empty-state">
                                    Loading Orders...
                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- ORDER MODAL -->

    <div
        id="orderModal"
        class="order-modal">

        <div class="order-modal-content">

            <span
                class="modal-close"
                onclick="closeModal()">

                ×

            </span>

            <div id="orderDetails">

            </div>

        </div>

    </div>

    <!-- JS -->

    <script src="js/dashboard.js"></script>

</body>

</html>
