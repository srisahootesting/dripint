<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Management | Drip Designs Admin</title>

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/products.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="products-container">

    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1 class="page-title">
                Product Management
            </h1>

            <p class="page-subtitle">
                Manage products, pricing and visibility
            </p>

        </div>

        <button
            class="add-product-btn"
            onclick="openAddProductModal()">

            + Add Product

        </button>

    </div>

    <!-- KPI CARDS -->

    <div class="kpi-grid">

        <div class="kpi-card">

            <div class="kpi-title">
                Total Products
            </div>

            <div
                class="kpi-value"
                id="totalProducts">

                0

            </div>

        </div>

        <div class="kpi-card">

            <div class="kpi-title">
                Active Products
            </div>

            <div
                class="kpi-value"
                id="activeProducts">

                0

            </div>

        </div>

        <div class="kpi-card">

            <div class="kpi-title">
                Inactive Products
            </div>

            <div
                class="kpi-value"
                id="inactiveProducts">

                0

            </div>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-section">

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search by Product Name, Category or Qikink Product ID">

    </div>

    <!-- TABLE -->

    <div class="table-wrapper">

        <table class="products-table">

            <thead>

                <tr>

                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Qikink Product ID</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productsTableBody">

                <tr>

                    <td colspan="7" class="no-data">

                        Loading Products...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- PRODUCT MODAL -->

<div
    class="modal-overlay"
    id="productModal">

    <div class="modal">

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitle">

                Add Product

            </h2>

            <button
                class="close-btn"
                onclick="closeProductModal()">

                &times;

            </button>

        </div>

        <form id="productForm">

            <input
                type="hidden"
                id="productId">

            <div class="form-group">

                <label class="form-label">
                    Qikink Product ID
                </label>

                <input
                    type="text"
                    id="qikinkProductId"
                    class="form-input">

            </div>

            <div class="form-group">

                <label class="form-label">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    class="form-input"
                    required>

            </div>

            <div class="form-group">

                <label class="form-label">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    class="form-input">

            </div>

            <div class="form-group">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    id="description"
                    class="form-textarea"></textarea>

            </div>

            <div class="form-group">

                <label class="form-label">
                    Image URL
                </label>

                <input
                    type="text"
                    id="imageUrl"
                    class="form-input">

            </div>

            <div class="form-group">

                <label class="form-label">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    step="0.01"
                    class="form-input"
                    required>

            </div>

            <div class="form-group">

                <label class="form-label">
                    Status
                </label>

                <select
                    id="status"
                    class="form-select">

                    <option value="ACTIVE">
                        ACTIVE
                    </option>

                    <option value="INACTIVE">
                        INACTIVE
                    </option>

                </select>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn-cancel"
                    onclick="closeProductModal()">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn-save">

                    Save Product

                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/products.js"></script>

</body>
</html>
