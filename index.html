<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripInt Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>DripInt</h1>
    <p class="subtitle">Secure OTP Authentication</p>

    <div id="loginSection">

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <button onclick="sendOTP()">
            Send OTP
        </button>

        <input
            type="text"
            id="otp"
            placeholder="Enter OTP"
        >

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

        <p id="message"></p>

    </div>

    <div id="dashboard" style="display:none;">

        <h2>Dashboard</h2>

        <p>
            Logged in as:
            <strong id="userEmail"></strong>
        </p>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
